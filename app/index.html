<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VetFlowCare — abrindo o aplicativo…</title>
<meta name="theme-color" content="#12294f">
<!-- ATALHO: este arquivo NÃO é o app. Ele só encaminha para onde o app
     realmente está hoje. O aplicativo continua no repositório dele, intocado.
     Se um dia o app mudar de endereço, troque apenas a linha DESTINO abaixo. -->
<meta http-equiv="refresh" content="0; url=https://brunorizzieri86-svg.github.io/vetflowcare/">
<link rel="canonical" href="https://brunorizzieri86-svg.github.io/vetflowcare/">
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(160deg,#12294f,#15305c 55%,#2DC0AE);color:#fff;
    display:flex;align-items:center;justify-content:center;text-align:center}
  .box{padding:28px}
  .logo{width:66px;height:66px;border-radius:18px;background:#fff;display:flex;align-items:center;
    justify-content:center;font-size:34px;margin:0 auto 16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  h1{font-size:21px;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
  h1 i{font-style:normal;color:#7FE8DB}
  .care{font-family:Georgia,serif;font-style:italic;font-weight:400;color:#7FE8DB}
  p{color:rgba(255,255,255,.82);font-size:14px;margin:0 0 18px}
  .spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.25);border-top-color:#7FE8DB;
    border-radius:50%;margin:0 auto 18px;animation:g .9s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  a{color:#7FE8DB;font-weight:700;text-decoration:none}
  .slogan{margin-top:22px;font-size:10px;letter-spacing:.3em;color:rgba(255,255,255,.4);font-weight:600}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">🐾</div>
    <div class="spin"></div>
    <h1>Vet<i>Flow</i><span class="care">Care</span></h1>
    <p>Abrindo o aplicativo…</p>
    <p style="font-size:13px">Se não abrir sozinho em 3 segundos,<br>
      <a href="https://brunorizzieri86-svg.github.io/vetflowcare/">toque aqui para entrar</a></p>
    <div class="slogan">ORGANIZA · CONECTA · CUIDA</div>
  </div>
  <script>
    // Reforço: se o navegador ignorar o <meta refresh>, o JS garante o encaminhamento.
    setTimeout(function(){
      location.replace('https://brunorizzieri86-svg.github.io/vetflowcare/');
    }, 100);
  </script>
</body>
</html>
